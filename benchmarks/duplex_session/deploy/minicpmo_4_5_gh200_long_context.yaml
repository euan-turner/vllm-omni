# MiniCPM-o 4.5 three-stage duplex deploy on one GH200 (~95 GiB visible to CUDA), for
# long-context profiling. Used by benchmarks/duplex_session/serve.sh LAYOUT=gh200.
#
# Prototype (branch long-context-prototype). Inherits the single-H200 duplex
# profile (all stages on GPU 0, Stage 0/2 optimisations on).
#
# Stage-0 max_model_len is set by serve.sh (MAX_MODEL_LEN, default and maximum
# 40960, the HF limit); a session that outgrows it ends with
# context_length_exceeded. Extending past 40960 was tried and dropped: sessions
# degenerate before the limit (benchmarks/duplex_session/long_context/observations.md).
base_config: ../../../vllm_omni/deploy/minicpmo_4_5_duplex_h200.yaml

duplex_session:
  max_sessions: 4

stages:
  - stage_id: 0
    max_num_seqs: 4
    # ~145 KiB/token: 4 x 40960 tokens is ~23 GiB, inside Stage 0's ~27 GiB KV
    # pool at 0.5. 0.5 of the ~95 GiB CUDA sees leaves headroom outside the budgets:
    # Stage 0's caching allocator reserves ~25 GiB beyond its budget by 30k
    # tokens (allocated stays flat), which starved Stage 1 at 0.6 (job 7766599);
    # the sbatch also sets expandable_segments for this.
    gpu_memory_utilization: 0.5
  - stage_id: 1
    max_num_seqs: 4
  - stage_id: 2
    max_num_seqs: 4
