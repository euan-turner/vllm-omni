# MiniCPM-o 4.5 three-stage duplex deploy on one GH200 (~95 GiB visible to CUDA), for
# long-context profiling. Used by benchmarks/duplex_session/serve.sh LAYOUT=gh200.
#
# Prototype (branch long-context-prototype). Inherits the single-H200 duplex
# profile (all stages on GPU 0, Stage 0/2 optimisations on).
#
# Stage-0 max_model_len is set by serve.sh (MAX_MODEL_LEN, default 131072).
# Values above the HF limit (40960) are an explicit context overflow: serve.sh
# exports VLLM_ALLOW_LONG_MAX_MODEL_LEN=1, positions past 40960 are
# extrapolated, and model quality there is not meaningful. Use it for systems
# measurements only.
base_config: ../../../vllm_omni/deploy/minicpmo_4_5_duplex_h200.yaml

duplex_session:
  max_sessions: 4

stages:
  - stage_id: 0
    max_num_seqs: 4
    # ~145 KiB/token: 4 x 131072 tokens is ~73 GiB, which does not fit next to
    # Talker and Code2Wav. vLLM only requires one full-length request (~18 GiB);
    # with concurrent long sessions, preemption or overflow shows up in the tick
    # trace. 0.5 of the ~95 GiB CUDA sees leaves headroom for Stage 1's
    # unbudgeted growth over long sessions (CUDA OOM at 0.6, job 7766599).
    gpu_memory_utilization: 0.5
  - stage_id: 1
    max_num_seqs: 4
  - stage_id: 2
    max_num_seqs: 4
