# MiniCPM-o 4.5 W4A16 GPTQ three-stage duplex deploy for one 32 GB GPU
# (RTX 5090), audio + video. Used by benchmarks/duplex_session/serve.sh
# LAYOUT=1gpu-int4 with openbmb/MiniCPM-o-4_5-GPTQ.
#
# Design doc: docs/design/fullduplex.md (Serving); recipe:
# recipes/OpenBMB/MiniCPM-o-4_5.md. Inherits the BF16 one-GPU budget and
# overrides only modality limits, context length and the Thinker KV pool.
#
# Prototype: stage memory budgets have not been measured with these weights.
base_config: minicpmo_4_5_1gpu_32gb.yaml

stages:
  - stage_id: 0
    # About 5 min of audio + video per session at up to 84 tokens/s. A session
    # that outgrows this is terminated with context_length_exceeded.
    max_model_len: 25600
    # Replaces the audio-only mapping. image > 0 builds the SigLIP tower that
    # duplex video_frames use; the video bound limits start-up profiling.
    limit_mm_per_prompt:
      image: 1
      video:
        count: 1
        num_frames: 32
      audio: 64
  - stage_id: 1
    # Upstream duplex TTS (MiniCPMTTS.generate_chunk) applies temperature and
    # repetition penalty only: it builds top-k/top-p warpers but never uses them.
    default_sampling_params:
      temperature: 0.8
      repetition_penalty: 1.05
      top_p: 1.0
      top_k: -1

platforms:
  cuda:
    stages:
      - stage_id: 0
        # ~7,300 tokens/GiB: 7.25 GiB holds ~53k tokens, two full 25600 requests.
        kv_cache_memory_bytes: 7784628224  # 7.25 GiB
